# nginx da loja e do admin (SPA React com rotas no navegador).
server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  include /etc/nginx/security-headers.conf;

  # Assets com hash no nome (Vite): nunca mudam, cache de 1 ano. Arquivo que não existe é 404 de
  # verdade (e não o index.html, que o navegador tentaria executar como script).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/security-headers.conf;
  }

  # O HTML nunca fica em cache: aponta para os assets do build atual. Vale também para o fallback
  # de SPA (o try_files abaixo redireciona internamente para /index.html e cai neste bloco).
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
  }

  # Fallback de SPA: /admin/produtos, /pedido/<id> etc. são rotas do React, não arquivos.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
