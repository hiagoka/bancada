# Cabeçalhos de segurança. Incluído em CADA bloco que usa add_header: no nginx, add_header dentro de
# um location substitui (não soma) os do nível acima.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# CSP só em modo relatório: bloqueia nada, mas aparece no console se algo fugir da política.
# (Imagens vêm do S3/MinIO e a API fica em outra origem, por isso http/https amplos em img e connect.)
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; font-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
