services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bancada
      POSTGRES_PASSWORD: bancada
      POSTGRES_DB: bancada
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bancada -d bancada']
      interval: 5s
      timeout: 3s
      retries: 10

  # As imagens oficiais minio/minio e minio/mc saíram do Docker Hub e do Quay; usamos o
  # fork mantido pgsty/minio (mesma API S3). Ver D24 no ARCHITECTURE.md.
  minio:
    image: pgsty/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  minio-init:
    image: pgsty/mc
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: >
      /bin/sh -c "
      until mc ls local >/dev/null 2>&1; do sleep 1; done &&
      mc mb --ignore-existing local/bancada &&
      mc anonymous set download local/bancada
      "
    restart: 'no'

volumes:
  db-data:
  minio-data:
