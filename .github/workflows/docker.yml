name: Docker

# Prova o `docker compose up --build`: sobe a stack inteira (db, minio, minio-init, api, web) e
# confere com curl que a loja, o admin e o upload de imagem funcionam. Roda no push para a main, em
# pull requests que mexem na infra ou no código das imagens (api, web, packages) e sob demanda (Actions > Docker > Run workflow, em qualquer branch).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      # Infra
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      # Qualquer código que entra nas imagens
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API: http://localhost:3333
      WEB: http://localhost:8080
      S3: http://localhost:9000
      # Só do teste: o admin é criado e descartado dentro do job.
      ADMIN_EMAIL: admin@bancada.test
      ADMIN_PASSWORD: ci-only-admin-password-123
    steps:
      - uses: actions/checkout@v4

      - name: Sobe a stack (docker compose up --build)
        run: docker compose up --build -d

      # Em vez de `up --wait`: o resultado não depende de como cada versão do compose trata o
      # container de uma execução só (minio-init) que termina com sucesso.
      - name: Espera API e web ficarem saudáveis
        run: |
          wait_for() {
            for i in $(seq 1 90); do
              if curl -fsS -o /dev/null "$1"; then echo "ok: $1"; return 0; fi
              sleep 2
            done
            echo "tempo esgotado esperando $1"; return 1
          }
          wait_for "$API/health"
          wait_for "$WEB/"
          docker compose ps -a

      - name: Smoke - API (health e catálogo do seed)
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/health")" = "200"
          curl -fsS "$API/products" -o products.json
          count=$(jq '.data | length' products.json)
          echo "produtos: $count"
          test "$count" = "6"

      - name: Smoke - admin (criar admin pelo script, login, cookie httpOnly e CORS)
        run: |
          docker compose exec -T api node dist/scripts/create-admin.js \
            --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD" --name "Admin CI"
          body=$(jq -nc --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" '{email:$e,password:$p}')
          curl -sS -D headers.txt -o login.json -c jar.txt -X POST "$API/auth/login" \
            -H 'Content-Type: application/json' -H 'X-Requested-With: bancada-web' \
            -H "Origin: $WEB" -d "$body"
          head -n1 headers.txt | grep -q ' 200'
          login_headers=$(tr -d '\r' < headers.txt)
          cookie=$(grep -i '^set-cookie: bancada_admin=' <<<"$login_headers")
          echo "$cookie" | sed -E 's/(bancada_admin=)[^;]+/\1<oculto>/I'
          echo "$cookie" | grep -qi 'httponly'
          echo "$cookie" | grep -qi 'samesite=lax'
          echo "$cookie" | grep -qi 'path=/'
          grep -qi "^access-control-allow-origin: $WEB" <<<"$login_headers"
          # a sessão vale: /auth/me com o cookie
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt "$API/auth/me")" = "200"
          # sem o header CSRF a mutação é recusada (D15)
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt -X POST "$API/auth/logout" \
            -H 'Content-Type: application/json' -d '{}')" = "403"

      # D17: o seed nunca sobrescreve produtos existentes. Prova de verdade: o admin muda um preço, a
      # API reinicia (migra e semeia de novo no start) e o preço alterado tem de continuar.
      - name: Smoke - seed idempotente (preço editado sobrevive ao restart da API)
        run: |
          id=$(jq -r '.data[0].id' products.json)
          before=$(jq -r '.data[0].priceCents' products.json)
          new=$((before + 1234))
          curl -fsS -b jar.txt -X PATCH "$API/admin/products/$id" \
            -H 'Content-Type: application/json' -H 'X-Requested-With: bancada-web' \
            -d "{\"priceCents\":$new}" -o patched.json
          test "$(jq -r '.data.priceCents' patched.json)" = "$new"
          docker compose restart api
          healthy=false
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "$API/health"; then healthy=true; break; fi
            sleep 2
          done
          test "$healthy" = "true"
          after=$(curl -fsS "$API/products" | jq -r --arg id "$id" '.data[] | select(.id == $id) | .priceCents')
          echo "preço antes=$before, editado=$new, depois do restart=$after"
          test "$after" = "$new"
          test "$(curl -fsS "$API/products" | jq '.data | length')" = "6"

      - name: Smoke - web (HTML, fallback de SPA e cache)
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' "$WEB/")" = "200"
          curl -fsS "$WEB/" -o index.html
          grep -q '<div id="root"' index.html
          # rota do React (não é arquivo): o nginx devolve o index.html com 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$WEB/admin/produtos")" = "200"
          curl -fsS "$WEB/admin/produtos" | grep -q '<div id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$WEB/pedido/qualquer-id")" = "200"
          # o HTML não fica em cache; o asset com hash fica por 1 ano
          html_headers=$(curl -fsSI "$WEB/admin/produtos" | tr -d '\r')
          grep -qi '^cache-control:.*no-cache' <<<"$html_headers"
          asset=$(grep -o '/assets/[^"]*\.js' index.html | head -n1)
          test -n "$asset"
          asset_headers=$(curl -fsSI "$WEB$asset" | tr -d '\r')
          grep -qi '^cache-control:.*immutable' <<<"$asset_headers"
          # asset inexistente é 404 de verdade, não o index.html
          test "$(curl -s -o /dev/null -w '%{http_code}' "$WEB/assets/nao-existe.js")" = "404"
          grep -qi '^x-content-type-options: nosniff' <<<"$html_headers"
          # a URL da API gravada no bundle é a publicada pelo compose
          curl -fsS "$WEB$asset" -o bundle.js
          grep -q 'localhost:3333' bundle.js

      - name: Smoke - upload de imagem direto ao MinIO (o que o navegador faz)
        run: |
          curl -fsS -b jar.txt -X POST "$API/admin/uploads/product-image" \
            -H 'Content-Type: application/json' -H 'X-Requested-With: bancada-web' \
            -d '{"contentType":"image/png"}' -o upload.json
          url=$(jq -r '.data.uploadUrl' upload.json)
          key=$(jq -r '.data.key' upload.json)
          echo "uploadUrl: $url"
          # o navegador não enxerga minio:9000: o uploadUrl tem de usar o endereço publicado
          test "$url" = "$S3/bancada"
          # PNG de 1x1 pixel
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGP4z8DwHwAFAAH/q842iQAAAABJRU5ErkJggg==' | base64 -d > tiny.png
          args=()
          while IFS= read -r field; do args+=(--form-string "$field"); done \
            < <(jq -r '.data.fields | to_entries[] | "\(.key)=\(.value)"' upload.json)
          status=$(curl -s -o /dev/null -w '%{http_code}' "${args[@]}" -F 'file=@tiny.png;type=image/png' "$url")
          echo "upload: $status"
          test "$status" = "204"
          # o objeto aparece na URL pública (leitura anônima liberada pelo minio-init)
          test "$(curl -s -o /dev/null -w '%{http_code}' "$S3/bancada/$key")" = "200"
          # CORS do MinIO para a origem do web
          obj_headers=$(curl -sSI -H "Origin: $WEB" "$S3/bancada/$key" | tr -d '\r')
          grep -qiE "^access-control-allow-origin: (\*|$WEB)" <<<"$obj_headers"

      - name: Logs dos containers (só em caso de falha)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Derruba a stack e apaga os volumes
        if: always()
        run: docker compose down -v
